[project]
name = "permitengine"
version = "0.1.0"
description = "Event-permit decisions: an LLM checks evidence, Jev answers tree questions, rules decide, and tree weights learn."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# One extra per LLM vendor whose adapter needs an SDK.
anthropic = ["anthropic>=0.40"]

[project.scripts]
permitengine = "permitengine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/permitengine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
