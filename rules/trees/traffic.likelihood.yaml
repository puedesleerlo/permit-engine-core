id: traffic.likelihood
version: 1
owner: policy_owner
hazard: traffic_conflict
scale: likelihood
questions:
  - id: escort_confirmed
    kind: evidence
    text: Is the police escort confirmed?
    evidence_types: [police_escort_letter, police_escort_email]
    clause: ORD-12.4
  - id: traffic_plan_adequate
    kind: jev
    text: Is the traffic plan adequate?
    instructions: Does the traffic plan cover every road closure on the route, with control at each major crossing, signed diversions, and a way through for emergency vehicles?
    needs: [route, traffic_plan]
    clause: ORD-12.2
leaves:  # first guess, written blind; see rules/first_guess.json
  - when: {escort_confirmed: true, traffic_plan_adequate: true}
    levels: [0.65, 0.3, 0.05]
  - when: {escort_confirmed: true, traffic_plan_adequate: false}
    levels: [0.2, 0.55, 0.25]
  - when: {escort_confirmed: false, traffic_plan_adequate: true}
    levels: [0.4, 0.48, 0.12]
  - when: {escort_confirmed: false, traffic_plan_adequate: false}
    levels: [0.05, 0.35, 0.6]
