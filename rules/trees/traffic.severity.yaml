id: traffic.severity
version: 1
owner: policy_owner
hazard: traffic_conflict
scale: severity
questions:
  - id: arterial_road
    kind: rule
    text: Does the route use an arterial road?
    clause: ORD-12.3
  - id: crowd_over_800
    kind: rule
    text: Is the crowd over 800?
    clause: ORD-1.2
leaves:  # first guess, written blind; see rules/first_guess.json
  - when: {arterial_road: true, crowd_over_800: true}
    levels: [0.05, 0.4, 0.55]
  - when: {arterial_road: true, crowd_over_800: false}
    levels: [0.1, 0.5, 0.4]
  - when: {arterial_road: false, crowd_over_800: true}
    levels: [0.3, 0.55, 0.15]
  - when: {arterial_road: false, crowd_over_800: false}
    levels: [0.5, 0.42, 0.08]
